languageCode = 'fr'

theme = "sebbeauchamp"
baseURL = 'https://sebastienbeauchamp.com'
defaultContentLanguage = "fr"
defaultContentLanguageInSubdir = false
enableGitInfo = false
enableEmoji = true
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]



[params]
_merge = "deep"
rssFullContent = true
homePagerSize = 5
sectionPagerSize = 10
images = [ "images/sebastienbeauchamp.jpg" ]
available = true
email = "contact@sebastienbeauchamp.com"
newsletter_url = "https://sebbeauchamp.substack.com"

[[params.social]]
name = "Linkedin"
url = "https://www.linkedin.com/in/sebbeauchamp/"

[[params.social]]
name = "Dribbble"
url = "https://dribbble.com/sebbeauchamp"

[[params.social]]
name = "Instagram"
url = "https://www.instagram.com/sebbeauchamp/"

[[params.social]]
name = "Unsplash"
url = "https://unsplash.com/fr/@sebbeauchamp"

[frontmatter]
lastmod = [ "lastmod", ":default" ]

[markup]
_merge = "deep"

[markup.goldmark.renderer]
unsafe = true

